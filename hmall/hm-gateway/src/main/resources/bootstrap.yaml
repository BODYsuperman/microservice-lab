spring:
  application:
    name: hm-gateway # 服务名称
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: localhost:8848 # nacos地址
      config:
        file-extension: yaml # 文件后缀名
        shared-configs:
          - dataId: shared-jwt.yaml
          - dataId: shared-log.yaml # 共享日志配置
            group: DEFAULT_GROUP